; Production PHP settings for UTStats.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; Mitigations from the 2026-10-21 PHP advisory, kept as defense in depth even on patched builds.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
post_max_size = 8M
upload_max_filesize = 2M
file_uploads = Off
max_input_vars = 1000

memory_limit = 256M
max_execution_time = 60

session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1

allow_url_fopen = Off
allow_url_include = Off
date.timezone = UTC
